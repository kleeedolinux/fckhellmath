<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F*CK Hell Math</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    #whiteboard {
      touch-action: none;
    }
    
    @media (max-width: 768px) {
      .flex-container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
  <div class="container mx-auto px-4 py-8">
    <h1 class="text-4xl font-bold text-center mb-2">F*CK Hell Math</h1>
    <div class="text-center mb-8 text-gray-400">
      <span class="text-gray-300 font-medium">Streak:</span> <span id="dayCounter">0</span> days
      <div class="text-xs mt-1">Days you've trained with us</div>
    </div>
    
    <div class="flex-container flex flex-wrap gap-6">
      <!-- Main Math Panel -->
      <div class="w-full lg:w-1/2">
        <div class="bg-gray-800 rounded-lg p-6 shadow-lg">
          <div class="mb-6">
            <label class="block font-medium mb-2">Difficulty (Number of Digits)</label>
            <select id="difficulty" class="w-full bg-gray-700 rounded px-3 py-2 mb-2">
              <option value="1">1 Digit (Easy)</option>
              <option value="2" selected>2 Digits (Medium)</option>
              <option value="3">3 Digits (Hard)</option>
              <option value="4">4 Digits (Brutal)</option>
              <option value="5">5 Digits (Hell)</option>
              <option value="custom">Custom</option>
            </select>
            
            <div id="customDigitsContainer" class="hidden mt-2">
              <label class="block font-medium mb-1">Enter Custom Digits (1-99)</label>
              <input type="number" id="customDigits" min="1" max="99" value="6" class="w-full bg-gray-700 rounded px-3 py-2">
            </div>
          </div>
          
          <div class="mb-6">
            <label class="block font-medium mb-2">Operations</label>
            <div class="flex flex-wrap gap-2">
              <label class="inline-flex items-center">
                <input type="checkbox" class="operation" value="+" checked>
                <span class="ml-2">Addition (+)</span>
              </label>
              <label class="inline-flex items-center">
                <input type="checkbox" class="operation" value="-" checked>
                <span class="ml-2">Subtraction (-)</span>
              </label>
              <label class="inline-flex items-center">
                <input type="checkbox" class="operation" value="*" checked>
                <span class="ml-2">Multiplication (×)</span>
              </label>
              <label class="inline-flex items-center">
                <input type="checkbox" class="operation" value="/" checked>
                <span class="ml-2">Division (÷)</span>
              </label>
            </div>
          </div>
          
          <button id="startBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
            Start Challenge
          </button>
        </div>
        
        <div id="challenge" class="mt-8 bg-gray-800 rounded-lg p-6 shadow-lg hidden">
          <div class="text-center mb-4">
            <div class="text-2xl font-bold" id="question"></div>
          </div>
          
          <div class="mb-4">
            <input type="number" id="answer" class="w-full bg-gray-700 rounded px-3 py-2" placeholder="Your answer">
          </div>
          
          <button id="submitBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
            Submit
          </button>
          
          <div id="result" class="mt-4 text-center hidden"></div>
          
          <div id="timer" class="mt-2 text-center text-yellow-400 font-medium hidden"></div>
          
          <button id="showResultBtn" class="w-full mt-4 bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded hidden">
            Show Result
          </button>
          
          <button id="nextBtn" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded hidden">
            Next Challenge
          </button>
        </div>
      </div>
      
      <!-- Whiteboard Panel -->
      <div class="w-full lg:w-5/12">
        <div class="bg-gray-800 rounded-lg p-6 shadow-lg h-full">
          <div class="mb-4 flex justify-between items-center">
            <h2 class="text-xl font-bold">Scratch Pad</h2>
            <div class="flex space-x-2">
              <button id="clearWhiteboard" class="bg-red-600 hover:bg-red-700 text-white font-medium py-1 px-3 rounded text-sm">
                Clear
              </button>
              <button id="colorToggle" class="bg-gray-600 hover:bg-gray-700 text-white font-medium py-1 px-3 rounded text-sm">
                Color
              </button>
            </div>
          </div>
          <div class="whiteboard-container bg-white rounded-lg overflow-hidden">
            <canvas id="whiteboard" class="w-full h-64 lg:h-96 cursor-crosshair rounded-lg"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="app.js"></script>
  <script>
    $(document).ready(function() {
      const canvas = document.getElementById('whiteboard');
      const ctx = canvas.getContext('2d');
      let isDrawing = false;
      let currentColor = '#000000';
      let lastX = 0;
      let lastY = 0;
      
      function resizeCanvas() {
        const container = canvas.parentElement;
        canvas.width = container.offsetWidth;
        canvas.height = canvas.offsetHeight;
      }
      
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      
      function startDrawing(e) {
        isDrawing = true;
        [lastX, lastY] = getCoordinates(e);
      }
      
      function stopDrawing() {
        isDrawing = false;
      }
      
      function draw(e) {
        if (!isDrawing) return;
        
        const [currentX, currentY] = getCoordinates(e);
        
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(currentX, currentY);
        ctx.stroke();
        
        [lastX, lastY] = [currentX, currentY];
      }
      
      function getCoordinates(e) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        return [x, y];
      }
      
      function getTouchCoordinates(e) {
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        const x = touch.clientX - rect.left;
        const y = touch.clientY - rect.top;
        return [x, y];
      }
      
      function startDrawingTouch(e) {
        isDrawing = true;
        [lastX, lastY] = getTouchCoordinates(e);
      }
      
      function drawTouch(e) {
        if (!isDrawing) return;
        e.preventDefault();
        
        const [currentX, currentY] = getTouchCoordinates(e);
        
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(currentX, currentY);
        ctx.stroke();
        
        [lastX, lastY] = [currentX, currentY];
      }
      
      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseout', stopDrawing);
      
      canvas.addEventListener('touchstart', startDrawingTouch);
      canvas.addEventListener('touchmove', drawTouch);
      canvas.addEventListener('touchend', stopDrawing);
      
      $('#clearWhiteboard').click(function() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      });
      
      $('#colorToggle').click(function() {
        if (currentColor === '#000000') {
          currentColor = '#ff0000'; 
          $(this).css('background-color', '#ff0000');
        } else if (currentColor === '#ff0000') {
          currentColor = '#0000ff';
          $(this).css('background-color', '#0000ff');
        } else {
          currentColor = '#000000'; 
          $(this).css('background-color', '#4b5563');
        }
      });
    });
  </script>
</body>
</html>
